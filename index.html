<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clemson New Tab</title>
<style>
  :root {
    /* Top/bottom sky colors, kept in sync with the time of day by the
       script below. Initial values match the original night artwork so
       there's no flash-of-wrong-color before the script runs. */
    --sky-zenith: #0F0A24;
    --sky-horizon: #1D1440;
    /* vw-coefficients for each layer's "bottom" gap, set by the script
       below. Each blends between its resting (tall-window) value and a
       small nested-stack value (short-window) as viewport height shrinks. */
    --l5-vw: 20.83;
    --l4-vw: 8.23;
    --l3-vw: 3.33;
    --l2-vw: 0.16;
    --l1-vw: 0.47;
    /* Set by the script below once weather data loads. */
    --weather-tint: rgba(0, 0, 0, 0);
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(to bottom, var(--sky-zenith), var(--sky-horizon));
  }

  .scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: linear-gradient(to bottom, var(--sky-zenith), var(--sky-horizon));
    transition: background 60s linear;
  }

  .scene img.layer {
    position: absolute;
    left: 0;
    width: 100vw;
    height: auto;
    display: block;
    pointer-events: none;
  }

  /* Weather wash sits above the sky gradient but below the mountain
     layers, and transitions on its own faster timescale (the sky
     gradient's 60s transition is meant for the slow day/night drift). */
  #weather-overlay {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: var(--weather-tint);
    transition: background 4s ease;
    pointer-events: none;
  }

  /* Drifting weather clouds, populated by JS. Sits in the sky, behind
     the mountain layers - separate from the fixed decorative clouds
     baked into layer5/layer2's art. */
  #cloud-layer {
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }

  .weather-cloud {
    position: absolute;
    width: 120px;
    height: 40px;
    background: rgba(255, 255, 255, 0.55);
    border-radius: 50px;
    filter: blur(1px);
    animation-name: drift-cloud;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  .weather-cloud::before,
  .weather-cloud::after {
    content: '';
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }

  .weather-cloud::before { width: 60px; height: 60px; top: -30px; left: 15px; }
  .weather-cloud::after  { width: 45px; height: 45px; top: -20px; left: 65px; }

  @keyframes drift-cloud {
    from { transform: translateX(-20vw) scale(var(--cloud-scale, 1)); }
    to   { transform: translateX(120vw) scale(var(--cloud-scale, 1)); }
  }

  /* Falling rain/snow, populated by JS. Overlays the entire page,
     including the UI, since precipitation reads as being in front of
     everything - but never intercepts clicks. */
  #precip-layer {
    position: fixed;
    inset: 0;
    z-index: 25;
    overflow: hidden;
    pointer-events: none;
  }

  .raindrop {
    position: absolute;
    top: -5vh;
    width: 2px;
    height: 18px;
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.65));
    animation-name: fall-rain;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes fall-rain {
    from { transform: translateY(0); }
    to   { transform: translateY(115vh); }
  }

  .snowflake {
    position: absolute;
    top: -5vh;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    animation-name: fall-snow;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes fall-snow {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(3vw, 55vh); }
    100% { transform: translate(-3vw, 115vh); }
  }

  /* Depth-ordered footer layers, farthest to nearest, with the logo and
     paw tucked into the stack (logo behind layer3, paw behind layer1)
     instead of always floating on top.
     "bottom" gaps are proportional to viewport width (vw); the script
     below adjusts each --lN-vw coefficient as the window gets short. */
  #layer5       { bottom: calc(var(--l5-vw) * 1vw); z-index: 2; } /* distant clouds */
  #layer4       { bottom: calc(var(--l4-vw) * 1vw); z-index: 3; } /* skyline w/ clock tower */
  #clemson-logo { z-index: 4; }                                   /* behind layer3 */
  #layer3       { bottom: calc(var(--l3-vw) * 1vw); z-index: 5; } /* mid mountains */
  #layer2       { bottom: calc(var(--l2-vw) * 1vw); z-index: 6; } /* near mountains + clouds */
  #paw          { z-index: 7; }                                   /* behind layer1 */
  #layer1       { bottom: calc(var(--l1-vw) * 1vw); z-index: 8; } /* foreground ridge */

  .corner-mark {
    position: absolute;
    pointer-events: none;
  }

  #clemson-logo {
    top: 4vh;
    left: 2.4vw;
    width: clamp(160px, 32vw, 620px);
    height: auto;
  }

  #paw {
    bottom: 5vh;
    right: 2.5vw;
    width: clamp(64px, 11vw, 210px);
    height: auto;
  }

  /* Firefox WebExtensions can't focus/select the real address bar on a
     new tab (a Mozilla platform limitation), so this page provides its
     own focused search box instead. */
  #search-form {
    position: fixed;
    top: 38vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    width: clamp(280px, 42vw, 580px);
  }

  #search-input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px 22px;
    font-size: 1.05rem;
    font-family: system-ui, sans-serif;
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 999px;
    outline: none;
    backdrop-filter: blur(6px);
  }

  #search-input::placeholder {
    color: rgba(255, 255, 255, 0.65);
  }

  #search-input:focus {
    border-color: #F56600;
    background: rgba(255, 255, 255, 0.16);
  }

  #weather-widget {
    position: fixed;
    top: 4vh;
    right: 2.5vw;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    font-family: system-ui, sans-serif;
    font-size: 1rem;
    color: #fff;
    white-space: nowrap;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 999px;
    backdrop-filter: blur(6px);
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  #weather-widget.visible {
    opacity: 1;
  }
</style>
</head>
<body>
  <div class="scene">
    <div id="weather-overlay"></div>
    <div id="cloud-layer"></div>
    <img id="layer5" class="layer" src="resources/Footer_Layer5.png" alt="">
    <img id="layer4" class="layer" src="resources/Footer_Layer4.png" alt="">
    <img id="clemson-logo" class="corner-mark" src="resources/ClemsonUniversity_RGB__Orange.png" alt="Clemson University">
    <img id="layer3" class="layer" src="resources/Footer_Layer3.png" alt="">
    <img id="layer2" class="layer" src="resources/Footer_Layer2.png" alt="">
    <img id="paw" class="corner-mark" src="resources/Paw_RGB__Orange.png" alt="Clemson Paw">
    <img id="layer1" class="layer" src="resources/Footer_Layer1.png" alt="">
  </div>

  <form id="search-form" action="https://www.google.com/search" autocomplete="off">
    <input id="search-input" type="text" name="q" placeholder="Search Google" autofocus>
  </form>

  <div id="weather-widget"></div>

  <div id="precip-layer"></div>

  <script>
    const SQUASH_REF_HEIGHT = 700;

    // Each layer's own rendered height (width:100vw; height:auto, so this
    // is fixed regardless of window height) in vw at the 1920px reference,
    // now that layers 1-4 are cropped tight to their content:
    //   layer1: 141px -> 7.34vw   layer3: 355px -> 18.49vw
    //   layer2: 253px -> 13.18vw  layer4: 335px -> 17.45vw
    // That height totally dominates a sub-1vw "bottom" nudge, which is
    // why small nested offsets barely moved anything visible. The nested
    // target for each layer is instead solved backwards from the TOP edge
    // we actually want (a fixed 1vw peek over the layer in front), via
    // offset = desiredTopEdge - ownHeight - which goes solidly negative
    // for the taller back layers, sinking them down behind the front one.
    const OWN_HEIGHT_VW = { l1: 7.34, l2: 13.18, l3: 18.49, l4: 17.45, l5: 27.6 };
    const PEEK_VW = 1; // each layer's top edge peeks this far above the one just in front, chain built off layer1

    // layer3/4/5 chain off layer1 exactly as before (1vw peek each step),
    // regardless of where layer2 ends up - only layer2 itself moves.
    let topEdge = OWN_HEIGHT_VW.l1 + PEEK_VW; // reference point one peek above layer1
    const nestedOffsets = { l1: 0 };
    for (const key of ['l3', 'l4', 'l5']) {
      topEdge += PEEK_VW;
      nestedOffsets[key] = topEdge - OWN_HEIGHT_VW[key];
    }

    // layer2 gets its own, smaller peek above layer1 so it tucks down
    // lower, independent of the layer3/4/5 chain above.
    const LAYER2_PEEK_VW = 0.2;
    nestedOffsets.l2 = (OWN_HEIGHT_VW.l1 + LAYER2_PEEK_VW) - OWN_HEIGHT_VW.l2;

    // Resting (tall-window) vs. nested-stack (short-window) vw-coefficient
    // for each layer's "bottom" gap.
    const LAYERS = {
      l1: { full: 0.47,  nested: nestedOffsets.l1 },
      l2: { full: 0.16,  nested: nestedOffsets.l2 },
      l3: { full: 3.33,  nested: nestedOffsets.l3 },
      l4: { full: 8.23,  nested: nestedOffsets.l4 },
      l5: { full: 20.83, nested: nestedOffsets.l5 },
    };

    function updateLayout() {
      const ratio = Math.min(1, Math.max(0, window.innerHeight / SQUASH_REF_HEIGHT));
      const t = ratio * ratio;
      const root = document.documentElement.style;
      for (const [key, { full, nested }] of Object.entries(LAYERS)) {
        root.setProperty(`--${key}-vw`, nested + (full - nested) * t);
      }
    }

    updateLayout();
    window.addEventListener('resize', updateLayout);

    // Belt-and-suspenders on top of the autofocus attribute, in case the
    // page is navigated to (rather than freshly loaded) by the new-tab
    // extension.
    document.getElementById('search-input').focus();

    // Sky color cycles with the time of day: each keyframe gives the
    // zenith (top of sky) and horizon (just above the mountains) color
    // at a given hour, and the current color is linearly interpolated
    // between the two nearest keyframes. Colors stay in the same
    // purple/orange family as the artwork rather than going true blue,
    // so daytime doesn't clash with the fixed-color mountain layers.
    // The hours themselves aren't fixed - sunriseHour/sunsetHour are
    // computed below from real sunrise/sunset for today, and everything
    // else is placed relative to those two anchors.
    const CLEMSON_SC = { lat: 34.6834, lng: -82.8374 }; // fallback if geolocation isn't available

    function buildSkyKeyframes(sunriseHour, sunsetHour) {
      return [
        { hour: 0,                zenith: '#0F0A24', horizon: '#1D1440' }, // midnight
        { hour: sunriseHour - 1.5, zenith: '#150F30', horizon: '#241748' }, // late night
        { hour: sunriseHour,      zenith: '#3B2E63', horizon: '#D97A4D' }, // sunrise
        { hour: sunriseHour + 2.5, zenith: '#5A76AE', horizon: '#E3A874' }, // morning
        { hour: (sunriseHour + sunsetHour) / 2, zenith: '#6F8FC2', horizon: '#C9A8D9' }, // midday
        { hour: sunsetHour - 2.5, zenith: '#5A76AE', horizon: '#E3A874' }, // afternoon
        { hour: sunsetHour,       zenith: '#3B2E63', horizon: '#D9633F' }, // sunset
        { hour: sunsetHour + 2,   zenith: '#1B1440', horizon: '#2E1A55' }, // dusk -> night
        { hour: 24,                zenith: '#0F0A24', horizon: '#1D1440' }, // wraps to midnight
      ];
    }

    // Self-contained sunrise/sunset calculation (standard solar-position
    // formulas per the NOAA/"sunrise equation" approach), so this works
    // offline instead of depending on a third-party API on every new tab.
    function getSunriseSunsetHours(date, lat, lng) {
      const rad = Math.PI / 180;
      const dayMs = 864e5;
      const J1970 = 2440588, J2000 = 2451545;
      const e = rad * 23.4397; // obliquity of the Earth

      const toDays = (d) => d.valueOf() / dayMs - 0.5 + J1970 - J2000;
      const solarMeanAnomaly = (d) => rad * (357.5291 + 0.98560028 * d);
      const eclipticLongitude = (M) => {
        const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
        return M + C + rad * 102.9372 + Math.PI;
      };
      const declination = (L) => Math.asin(Math.sin(L) * Math.sin(e));
      const julianCycle = (d, lw) => Math.round(d - 0.0009 - lw / (2 * Math.PI));
      const approxTransit = (Ht, lw, n) => 0.0009 + (Ht + lw) / (2 * Math.PI) + n;
      const solarTransitJ = (ds, M, L) => J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
      const hourAngle = (h, phi, dec) => Math.acos((Math.sin(h) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));

      const lw = rad * -lng;
      const phi = rad * lat;
      const d = toDays(date);
      const n = julianCycle(d, lw);
      const ds = approxTransit(0, lw, n);
      const M = solarMeanAnomaly(ds);
      const L = eclipticLongitude(M);
      const dec = declination(L);
      const Jnoon = solarTransitJ(ds, M, L);

      const h0 = rad * -0.833; // standard sunrise/sunset angle (refraction + solar radius)
      const w = hourAngle(h0, phi, dec);
      const Jset = solarTransitJ(approxTransit(w, lw, n), M, L);
      const Jrise = Jnoon - (Jset - Jnoon);

      const julianToHour = (J) => {
        const d2 = new Date((J + 0.5 - J1970) * dayMs);
        return d2.getHours() + d2.getMinutes() / 60;
      };
      return { sunriseHour: julianToHour(Jrise), sunsetHour: julianToHour(Jset) };
    }

    let SKY_KEYFRAMES = buildSkyKeyframes(6.5, 19); // sane default until real sunrise/sunset resolve

    // WMO weather codes (used by Open-Meteo) -> label/icon/overlay category.
    const WEATHER_CODES = {
      0:  { label: 'Clear',            emojiDay: '☀️', emojiNight: '🌙', category: 'clear' },
      1:  { label: 'Mostly Clear',     emojiDay: '🌤️', emojiNight: '🌙', category: 'clear' },
      2:  { label: 'Partly Cloudy',    emojiDay: '⛅', emojiNight: '☁️', category: 'cloudy' },
      3:  { label: 'Overcast',         emojiDay: '☁️', emojiNight: '☁️', category: 'cloudy' },
      45: { label: 'Fog',              emojiDay: '🌫️', emojiNight: '🌫️', category: 'fog' },
      48: { label: 'Fog',              emojiDay: '🌫️', emojiNight: '🌫️', category: 'fog' },
      51: { label: 'Light Drizzle',    emojiDay: '🌦️', emojiNight: '🌧️', category: 'rain' },
      53: { label: 'Drizzle',          emojiDay: '🌦️', emojiNight: '🌧️', category: 'rain' },
      55: { label: 'Heavy Drizzle',    emojiDay: '🌧️', emojiNight: '🌧️', category: 'rain' },
      56: { label: 'Freezing Drizzle', emojiDay: '🌧️', emojiNight: '🌧️', category: 'rain' },
      57: { label: 'Freezing Drizzle', emojiDay: '🌧️', emojiNight: '🌧️', category: 'rain' },
      61: { label: 'Light Rain',       emojiDay: '🌦️', emojiNight: '🌧️', category: 'rain' },
      63: { label: 'Rain',             emojiDay: '🌧️', emojiNight: '🌧️', category: 'rain' },
      65: { label: 'Heavy Rain',       emojiDay: '🌧️', emojiNight: '🌧️', category: 'rain' },
      66: { label: 'Freezing Rain',    emojiDay: '🌧️', emojiNight: '🌧️', category: 'rain' },
      67: { label: 'Freezing Rain',    emojiDay: '🌧️', emojiNight: '🌧️', category: 'rain' },
      71: { label: 'Light Snow',       emojiDay: '🌨️', emojiNight: '🌨️', category: 'snow' },
      73: { label: 'Snow',             emojiDay: '❄️', emojiNight: '❄️', category: 'snow' },
      75: { label: 'Heavy Snow',       emojiDay: '❄️', emojiNight: '❄️', category: 'snow' },
      77: { label: 'Snow Grains',      emojiDay: '❄️', emojiNight: '❄️', category: 'snow' },
      80: { label: 'Rain Showers',     emojiDay: '🌦️', emojiNight: '🌧️', category: 'rain' },
      81: { label: 'Rain Showers',     emojiDay: '🌧️', emojiNight: '🌧️', category: 'rain' },
      82: { label: 'Heavy Showers',    emojiDay: '🌧️', emojiNight: '🌧️', category: 'rain' },
      85: { label: 'Snow Showers',     emojiDay: '🌨️', emojiNight: '🌨️', category: 'snow' },
      86: { label: 'Snow Showers',     emojiDay: '🌨️', emojiNight: '🌨️', category: 'snow' },
      95: { label: 'Thunderstorm',     emojiDay: '⛈️', emojiNight: '⛈️', category: 'storm' },
      96: { label: 'Thunderstorm',     emojiDay: '⛈️', emojiNight: '⛈️', category: 'storm' },
      99: { label: 'Thunderstorm',     emojiDay: '⛈️', emojiNight: '⛈️', category: 'storm' },
    };

    // Translucent wash applied over the sky per weather category - kept
    // light now that clouds/rain/snow do most of the visual work below.
    const WEATHER_TINTS = {
      clear:  'rgba(0, 0, 0, 0)',
      cloudy: 'rgba(90, 95, 110, 0.18)',
      fog:    'rgba(170, 175, 185, 0.4)',
      rain:   'rgba(40, 50, 70, 0.3)',
      snow:   'rgba(210, 215, 230, 0.15)',
      storm:  'rgba(25, 25, 40, 0.4)',
    };

    function clearWeatherFX() {
      document.getElementById('cloud-layer').innerHTML = '';
      document.getElementById('precip-layer').innerHTML = '';
    }

    function spawnClouds(count, { top = [5, 45], scale = [0.6, 1.6], opacity = [0.3, 0.6], duration = [60, 110] } = {}) {
      const layer = document.getElementById('cloud-layer');
      for (let i = 0; i < count; i++) {
        const cloud = document.createElement('div');
        cloud.className = 'weather-cloud';
        const d = duration[0] + Math.random() * (duration[1] - duration[0]);
        cloud.style.top = `${top[0] + Math.random() * (top[1] - top[0])}vh`;
        cloud.style.setProperty('--cloud-scale', (scale[0] + Math.random() * (scale[1] - scale[0])).toFixed(2));
        cloud.style.opacity = (opacity[0] + Math.random() * (opacity[1] - opacity[0])).toFixed(2);
        cloud.style.animationDuration = `${d}s`;
        cloud.style.animationDelay = `${-Math.random() * d}s`;
        layer.appendChild(cloud);
      }
    }

    function spawnRain(count, { duration = [0.4, 0.8] } = {}) {
      const layer = document.getElementById('precip-layer');
      for (let i = 0; i < count; i++) {
        const drop = document.createElement('div');
        drop.className = 'raindrop';
        const d = duration[0] + Math.random() * (duration[1] - duration[0]);
        drop.style.left = `${Math.random() * 100}vw`;
        drop.style.animationDuration = `${d}s`;
        drop.style.animationDelay = `${-Math.random() * d}s`;
        layer.appendChild(drop);
      }
    }

    function spawnSnow(count) {
      const layer = document.getElementById('precip-layer');
      for (let i = 0; i < count; i++) {
        const flake = document.createElement('div');
        flake.className = 'snowflake';
        const size = 2 + Math.random() * 4;
        const d = 8 + Math.random() * 10;
        flake.style.width = flake.style.height = `${size}px`;
        flake.style.left = `${Math.random() * 100}vw`;
        flake.style.animationDuration = `${d}s`;
        flake.style.animationDelay = `${-Math.random() * d}s`;
        layer.appendChild(flake);
      }
    }

    function applyWeatherFX(category) {
      clearWeatherFX();
      switch (category) {
        case 'cloudy': spawnClouds(6); break;
        case 'fog':    spawnClouds(9, { top: [10, 55], scale: [1.4, 2.4], opacity: [0.3, 0.5], duration: [90, 150] }); break;
        case 'rain':   spawnClouds(4); spawnRain(70); break;
        case 'storm':  spawnClouds(6, { opacity: [0.45, 0.7] }); spawnRain(130, { duration: [0.3, 0.5] }); break;
        case 'snow':   spawnClouds(4); spawnSnow(60); break;
        // 'clear': nothing to spawn
      }
    }

    async function updateWeather(lat, lng) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}` +
          `&current=temperature_2m,weather_code,is_day&temperature_unit=fahrenheit&timezone=auto`;
        const res = await fetch(url);
        const { current } = await res.json();
        const info = WEATHER_CODES[current.weather_code] ||
          { label: 'Unknown', emojiDay: '🌡️', emojiNight: '🌡️', category: 'clear' };
        const emoji = current.is_day ? info.emojiDay : info.emojiNight;

        const widget = document.getElementById('weather-widget');
        widget.textContent = `${emoji} ${Math.round(current.temperature_2m)}°F · ${info.label}`;
        widget.classList.add('visible');
        document.documentElement.style.setProperty('--weather-tint', WEATHER_TINTS[info.category]);
        applyWeatherFX(info.category);
      } catch (err) {
        console.error('Weather fetch failed:', err);
      }
    }

    function applyLocation(lat, lng) {
      const { sunriseHour, sunsetHour } = getSunriseSunsetHours(new Date(), lat, lng);
      SKY_KEYFRAMES = buildSkyKeyframes(sunriseHour, sunsetHour);
      updateSky();

      updateWeather(lat, lng);
      setInterval(() => updateWeather(lat, lng), 30 * 60000); // refresh every 30 min
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => applyLocation(pos.coords.latitude, pos.coords.longitude),
        () => applyLocation(CLEMSON_SC.lat, CLEMSON_SC.lng),
        { timeout: 5000 }
      );
    } else {
      applyLocation(CLEMSON_SC.lat, CLEMSON_SC.lng);
    }

    function hexToRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function lerpColor(hexA, hexB, t) {
      const a = hexToRgb(hexA);
      const b = hexToRgb(hexB);
      const mixed = a.map((c, i) => Math.round(c + (b[i] - c) * t));
      return `rgb(${mixed.join(',')})`;
    }

    function updateSky() {
      const now = new Date();
      const hour = now.getHours() + now.getMinutes() / 60;

      let prev = SKY_KEYFRAMES[0];
      let next = SKY_KEYFRAMES[SKY_KEYFRAMES.length - 1];
      for (let i = 0; i < SKY_KEYFRAMES.length - 1; i++) {
        if (hour >= SKY_KEYFRAMES[i].hour && hour <= SKY_KEYFRAMES[i + 1].hour) {
          prev = SKY_KEYFRAMES[i];
          next = SKY_KEYFRAMES[i + 1];
          break;
        }
      }

      const span = next.hour - prev.hour;
      const t = span === 0 ? 0 : (hour - prev.hour) / span;
      const root = document.documentElement.style;
      root.setProperty('--sky-zenith', lerpColor(prev.zenith, next.zenith, t));
      root.setProperty('--sky-horizon', lerpColor(prev.horizon, next.horizon, t));
    }

    updateSky();
    setInterval(updateSky, 60000);
  </script>
</body>
</html>
